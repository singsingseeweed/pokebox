<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>오늘의 포켓몬</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<style>
/* ── 토큰 (박스와 같은 얼굴) ─────────────────────── */
:root{
  --ink:#0B0F24;
  --ink-2:#141A38;
  --line:rgba(232,180,74,.22);
  --foil:#E8B44A;
  --foil-soft:#F3D999;
  --paper:#ECE9F5;
  --muted:#8790BD;
  --t1:#5B639B;          /* 오늘 포켓몬의 첫 번째 타입 색 */
  --t2:#3A4176;          /* 두 번째 타입 색 (없으면 첫 번째와 같음) */

  --sans:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono','Roboto Mono','DejaVu Sans Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--ink);color:var(--paper);font-family:var(--sans);
  overflow:hidden;user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--foil);outline-offset:2px;border-radius:6px}

/* ── 배경화면 ─────────────────────────────────── */
.wall{
  position:fixed;inset:0;overflow:hidden;
  background:
    radial-gradient(120% 70% at 50% 62%, color-mix(in srgb, var(--t1) 55%, transparent), transparent 70%),
    radial-gradient(90% 50% at 100% 100%, color-mix(in srgb, var(--t2) 45%, transparent), transparent 70%),
    radial-gradient(80% 40% at 0% 0%, rgba(232,180,74,.10), transparent 70%),
    var(--ink);
  transition:background .8s;
}
/* 도트 격자 — 게임보이 화면 같은 결 */
.wall::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.2px);
  background-size:14px 14px;
}
.dexno{
  position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);
  font-family:var(--mono);font-weight:800;letter-spacing:-.04em;
  font-size:min(42vw, 30vh);line-height:1;color:rgba(255,255,255,.05);
  white-space:nowrap;pointer-events:none;
}

/* 시계 — 잠금화면처럼 위쪽에 */
.clock{
  position:absolute;left:0;right:0;top:calc(9vh + env(safe-area-inset-top));
  text-align:center;
}
.clock__date{font-size:clamp(15px,2.4vh,20px);font-weight:600;opacity:.85}
.clock__time{
  font-size:clamp(64px,13vh,120px);font-weight:700;letter-spacing:-.03em;line-height:1.05;
  font-variant-numeric:tabular-nums;
}

/* 오늘의 포켓몬 */
.stage{
  position:absolute;left:0;right:0;top:58%;transform:translateY(-50%);
  display:flex;justify-content:center;
}
.stage__glow{
  position:absolute;left:50%;top:50%;width:min(90vw,56vh);aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb, var(--t1) 70%, #fff 0%), transparent 65%);
  opacity:.55;filter:blur(8px);
}
.sprite{
  position:relative;width:min(84vw,48vh);aspect-ratio:1;
  image-rendering:pixelated;image-rendering:crisp-edges;
  filter:drop-shadow(0 18px 18px rgba(0,0,0,.45));
  animation:bob 4.8s ease-in-out infinite;
  opacity:0;transition:opacity .5s;
}
.sprite[data-ready]{opacity:1}
@keyframes bob{50%{transform:translateY(-1.6%)}}

.plate{
  position:absolute;left:16px;right:16px;bottom:calc(14vh + env(safe-area-inset-bottom));
  text-align:center;
}
.readout{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--foil-soft);opacity:.9}
.name{font-size:clamp(28px,4.6vh,40px);font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.genus{font-size:14px;color:rgba(236,233,245,.7)}
.types{display:flex;gap:6px;justify-content:center;margin-top:10px}
.type{font-size:12px;font-weight:700;padding:3px 11px;border-radius:999px;color:#10132A}
.flavor{
  max-width:34em;margin:12px auto 0;font-size:13px;line-height:1.6;
  color:rgba(236,233,245,.62);word-break:keep-all;
}
.flavor:empty{display:none}

/* ── 조작 막대 — 잠깐 뒤에 스르르 숨어요 ─────────── */
.bar{
  position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));
  transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  width:max-content;max-width:calc(100vw - 32px);
  padding:8px;border-radius:26px;background:rgba(11,15,36,.72);
  border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:opacity .35s, transform .35s;
}
body[data-idle] .bar{opacity:0;transform:translate(-50%,12px);pointer-events:none}
.btn{
  border:1px solid var(--line);background:var(--ink-2);color:var(--paper);text-decoration:none;
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
  white-space:nowrap;
}
.btn:hover{border-color:rgba(232,180,74,.5)}
.btn--gold{background:var(--foil);border-color:var(--foil);color:#231803}
.btn[aria-pressed="true"]{color:var(--foil-soft);border-color:rgba(232,180,74,.55)}

.toast{
  position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-8px);
  background:var(--ink-2);border:1px solid var(--line);color:var(--paper);
  padding:9px 16px;border-radius:999px;font-size:13px;z-index:10;
  opacity:0;pointer-events:none;transition:.22s;max-width:calc(100vw - 32px);text-align:center;
}
.toast[data-show]{opacity:1;transform:translate(-50%,0)}

body[data-noclock] .clock{display:none}
body[data-noclock] .stage,body[data-noclock] .dexno{top:46%}

@media (min-aspect-ratio: 4/3){          /* 가로 화면(PC)에서는 옆으로 나란히 */
  .stage,.dexno{top:55%}
  .sprite{width:min(52vh,40vw)}
  .plate{bottom:calc(10vh + env(safe-area-inset-bottom))}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="wall" id="wall" aria-live="polite">
  <div class="dexno" id="dexno" aria-hidden="true"></div>

  <div class="clock" id="clock">
    <div class="clock__date" id="clockDate"></div>
    <div class="clock__time" id="clockTime"></div>
  </div>

  <div class="stage">
    <div class="stage__glow" aria-hidden="true"></div>
    <img class="sprite" id="sprite" alt="">
  </div>

  <div class="plate">
    <div class="readout" id="tag">Pokémon of the day</div>
    <div class="name" id="name">불러오는 중…</div>
    <div class="genus" id="genus"></div>
    <div class="types" id="types"></div>
    <p class="flavor" id="flavor"></p>
  </div>
</div>

<nav class="bar" id="bar" aria-label="배경화면 설정">
  <a class="btn" href="./index.html">← 박스</a>
  <button class="btn" id="poolBtn" type="button" aria-pressed="false">내 박스</button>
  <button class="btn" id="clockBtn" type="button" aria-pressed="true">시계</button>
  <button class="btn btn--gold" id="saveBtn" type="button">⤓ 저장</button>
</nav>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';

/* ═══ 타입 (박스와 같은 색) ═══════════════════════ */
const TYPES = {
  normal:['노말','#B0AC82'], fire:['불꽃','#F08A30'], water:['물','#6FA0F5'],
  electric:['전기','#F7D02C'], grass:['풀','#7DC94E'], ice:['얼음','#8FD8D6'],
  fighting:['격투','#D64B45'], poison:['독','#B554B0'], ground:['땅','#E0C06A'],
  flying:['비행','#A99BF3'], psychic:['에스퍼','#F76B93'], bug:['벌레','#B0C226'],
  rock:['바위','#C1AE4E'], ghost:['고스트','#8168A8'], dragon:['드래곤','#8258FC'],
  dark:['악','#8A7263'], steel:['강철','#B9B9D2'], fairy:['페어리','#E294BC']
};
const KO2EN = Object.fromEntries(Object.entries(TYPES).map(([en,[ko]]) => [ko, en]));
const typeColor = ko => TYPES[KO2EN[ko]]?.[1] || '#5B639B';

/* 도트 주소 — 박스와 같은 BW 정지 도트를 먼저 씁니다 */
const SD = 'https://play.pokemonshowdown.com/sprites/';
const PA = 'https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/';
const GH = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';   // jsDelivr가 막혔을 때
const F_FEMALE = 2, F_COSMETIC = 4;
const slugify = en => (en || '')
  .normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/♀/g,'f').replace(/♂/g,'m')
  .toLowerCase().replace(/[^a-z0-9]/g,'');
function spriteURLs(m){
  const s = m.shiny, f = !!(m.flags & F_FEMALE), id = m.pid || m.dex, out = [];
  if (m.slug) out.push(`${SD}gen5${s?'-shiny':''}/${m.slug}.png`);
  if (!(m.flags & F_COSMETIC) && id) {
    out.push(`${PA}versions/generation-v/black-white/${s?'shiny/':''}${f?'female/':''}${id}.png`);
    out.push(`${PA}${s?'shiny/':''}${f?'female/':''}${id}.png`);
    out.push(`${GH}versions/generation-v/black-white/${s?'shiny/':''}${f?'female/':''}${id}.png`);
  }
  return out;
}

const MAX_DEX = 1025;
const KEY = 'pokebox:v1', IDXKEY = 'pokebox:dex:v5', PREFKEY = 'pokebox:wall:v1';

const el = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let toastT;
function toast(msg){
  const t = el('toast'); t.textContent = msg; t.setAttribute('data-show','');
  clearTimeout(toastT); toastT = setTimeout(() => t.removeAttribute('data-show'), 2600);
}

/* ═══ 저장소 (박스와 같은 규칙) ═════════════════════ */
async function readKey(k){
  if (window.storage) { try { const r = await window.storage.get(k); if (r?.value) return r.value; } catch(e){} }
  try { return localStorage.getItem(k); } catch(e){ return null; }
}
let prefs = { pool:'box', clock:true };
function savePrefs(){ try { localStorage.setItem(PREFKEY, JSON.stringify(prefs)); } catch(e){} }

/* ═══ 오늘의 씨앗 ═══════════════════════════════
   날짜(기기 시간 기준)만으로 정해지므로, 같은 날에는
   언제 몇 번을 열어도 같은 포켓몬이 나옵니다.            */
const dayKey = (d = new Date()) =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function seedOf(str){                         // FNV-1a
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
function rng(seed){                            // mulberry32
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ═══ 도감 정보 ══════════════════════════════════
   박스가 받아둔 이름표가 있으면 그걸 쓰고,
   설명·분류는 PokeAPI에서 받아옵니다 (오프라인이면 생략). */
let INDEX = null, TYPEMAP = {}, BASES = {};
async function loadIndex(){
  try {
    const raw = await readKey(IDXKEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.list?.length) { INDEX = d.list; TYPEMAP = d.types || {}; BASES = d.bases || {}; }
  } catch(e){}
}
async function getJSON(url){
  const r = await fetch(url);
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}
async function speciesInfo(dex){
  const out = { ko:'', en:'', genus:'', flavor:'', types:[] };
  const hit = INDEX?.find(x => x[0] === dex);
  if (hit) { out.ko = hit[1]; out.en = hit[2]; }
  if (TYPEMAP[dex]) out.types = TYPEMAP[dex].filter(Boolean);
  if (BASES[dex]) out.base = BASES[dex];
  try {
    const sp = await getJSON(`https://pokeapi.co/api/v2/pokemon-species/${dex}/`);
    out.ko = out.ko || sp.names?.find(n => n.language.name === 'ko')?.name || '';
    out.en = out.en || sp.names?.find(n => n.language.name === 'en')?.name?.toLowerCase() || '';
    out.base = out.base || sp.name;
    out.genus = sp.genera?.find(g => g.language.name === 'ko')?.genus || '';
    const fl = (sp.flavor_text_entries || []).filter(f => f.language.name === 'ko');
    if (fl.length) out.flavor = fl[fl.length - 1].flavor_text.replace(/[\n\f­]+/g, ' ').replace(/\s+/g,' ').trim();
  } catch(e){}
  if (!out.types.length) {
    try {
      const p = await getJSON(`https://pokeapi.co/api/v2/pokemon/${dex}/`);
      out.types = p.types.sort((a,b) => a.slot - b.slot).map(t => TYPES[t.type.name]?.[0]).filter(Boolean);
    } catch(e){}
  }
  return out;
}

/* ═══ 오늘의 포켓몬 고르기 ═══════════════════════ */
let box = [];
async function loadBox(){
  try { const raw = await readKey(KEY); box = raw ? (JSON.parse(raw).mons || []) : []; }
  catch(e){ box = []; }
}
const useBox = () => prefs.pool === 'box' && box.length > 0;

function pickToday(day){
  const r = rng(seedOf('pokebox:' + day));
  if (useBox()) {
    // 박스는 순서를 섞은 목록을 날짜 순서대로 돌기 때문에
    // 박스에 있는 모두가 골고루 한 번씩 나옵니다.
    const n = box.length;
    const days = Math.floor(Date.parse(day + 'T00:00:00Z') / 864e5);
    const round = Math.floor(days / n), idx = days % n;
    const order = box.map((_, i) => i);
    const rr = rng(seedOf('pokebox:round:' + round + ':' + n));
    for (let i = n - 1; i > 0; i--){ const j = Math.floor(rr() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    return { kind:'box', mon: box[order[idx]] };
  }
  const dex = 1 + Math.floor(r() * MAX_DEX);
  const shiny = r() < 1 / 64;                 // 가끔은 이로치가 찾아와요
  return { kind:'dex', mon: { dex, shiny, flags:0 } };
}

/* ═══ 그리기 ═════════════════════════════════════ */
let today = null;      // { day, kind, mon, info, types, name, spriteBlobURL }

async function loadSprite(m){
  for (const u of (m.sprite ? [m.sprite] : []).concat(spriteURLs(m))){
    try {
      if (u.startsWith('data:')) return u;
      const r = await fetch(u);
      if (!r.ok) continue;
      const b = await r.blob();
      if (!/^image\//.test(b.type)) continue;
      return URL.createObjectURL(b);        // 같은 출처로 바꿔두면 캔버스에도 그릴 수 있어요
    } catch(e){}
  }
  return '';
}

async function show(){
  const day = dayKey();
  const { kind, mon } = pickToday(day);
  const m = { ...mon };
  const info = m.dex ? await speciesInfo(m.dex) : { ko:'', genus:'', flavor:'', types:[] };
  if (!m.slug && (info.base || info.en)) m.slug = slugify(info.base || info.en);
  const types = (kind === 'box' && m.types?.length ? m.types : info.types).filter(Boolean);
  const name = kind === 'box' ? (m.nick || m.species || info.ko) : (info.ko || info.en || `No.${m.dex}`);
  const sub = kind === 'box'
    ? [m.nick && m.species && m.nick !== m.species ? m.species : '', m.form, m.level && `Lv.${m.level}`, m.game].filter(Boolean).join(' · ')
    : info.genus;

  if (today?.spriteURL?.startsWith('blob:')) URL.revokeObjectURL(today.spriteURL);
  const spriteURL = await loadSprite(m);
  today = { day, kind, m, info, types, name, sub, spriteURL };

  const c1 = types[0] ? typeColor(types[0]) : '#5B639B';
  const c2 = types[1] ? typeColor(types[1]) : c1;
  document.documentElement.style.setProperty('--t1', c1);
  document.documentElement.style.setProperty('--t2', c2);
  document.querySelector('meta[name=theme-color]').content = '#0B0F24';

  el('dexno').textContent = m.dex ? String(m.dex).padStart(4, '0') : '';
  el('tag').textContent = (m.shiny ? '✦ Shiny · ' : '') +
    (kind === 'box' ? 'Partner of the day' : 'Pokémon of the day') +
    (m.dex ? ` · No.${String(m.dex).padStart(4,'0')}` : '');
  el('name').textContent = name;
  el('genus').textContent = sub || '';
  el('types').innerHTML = types.map(t =>
    `<span class="type" style="background:${typeColor(t)}">${esc(t)}</span>`).join('');
  el('flavor').textContent = kind === 'box' && m.memo ? m.memo : info.flavor;

  const img = el('sprite');
  img.removeAttribute('data-ready');
  img.alt = name;
  if (spriteURL) { img.onload = () => img.setAttribute('data-ready',''); img.src = spriteURL; }
  else img.removeAttribute('src');
  document.title = `오늘의 포켓몬 · ${name}`;
}

/* ═══ 시계 + 자정에 바뀌기 ═══════════════════════ */
const DOW = ['일','월','화','수','목','금','토'];
function tick(){
  const d = new Date();
  el('clockTime').textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  el('clockDate').textContent = `${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`;
  if (today && today.day !== dayKey(d)) show();          // 날짜가 바뀌면 새 포켓몬
}
function startClock(){
  tick();
  const wait = 60000 - (Date.now() % 60000);
  setTimeout(() => { tick(); setInterval(tick, 60000); }, wait + 30);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
}

/* ═══ 이미지로 저장 ══════════════════════════════
   이 기기 화면 크기 그대로 PNG를 만들어서
   사진 앱에 저장한 뒤 배경화면으로 지정할 수 있어요.      */
function loadImg(src){
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
async function renderPNG(){
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const W = Math.round(screen.width * dpr), H = Math.round(screen.height * dpr);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  const cs = getComputedStyle(document.documentElement);
  const c1 = cs.getPropertyValue('--t1').trim(), c2 = cs.getPropertyValue('--t2').trim();
  const alpha = (hex, a) => hex + Math.round(a * 255).toString(16).padStart(2,'0');
  const u = Math.min(W, H) / 100;           // 짧은 변의 1%
  const cy = H * (W < H ? .58 : .55);

  g.fillStyle = '#0B0F24'; g.fillRect(0, 0, W, H);
  const glow = (x, y, rx, ry, color) => {
    g.save(); g.translate(x, y); g.scale(1, ry / rx);
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, rx);
    gr.addColorStop(0, color); gr.addColorStop(1, 'transparent');
    g.fillStyle = gr; g.fillRect(-rx, -rx, rx * 2, rx * 2); g.restore();
  };
  glow(W/2, cy, W * .85, H * .5, alpha(c1, .55));
  glow(W, H, W * .8, H * .45, alpha(c2, .45));
  glow(0, 0, W * .7, H * .35, 'rgba(232,180,74,.10)');

  // 도트 격자
  g.fillStyle = 'rgba(255,255,255,.07)';
  const step = 14 * dpr;
  for (let y = step / 2; y < H; y += step) for (let x = step / 2; x < W; x += step) g.fillRect(x, y, dpr, dpr);

  // 큰 도감번호
  if (today.m.dex) {
    g.fillStyle = 'rgba(255,255,255,.05)';
    g.font = `800 ${Math.min(W * .42, H * .3)}px ui-monospace,'SF Mono','Roboto Mono',monospace`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(String(today.m.dex).padStart(4,'0'), W / 2, cy);
  }

  // 포켓몬 — 픽셀이 뭉개지지 않게 정수배로 키웁니다
  if (today.spriteURL) {
    try {
      const im = await loadImg(today.spriteURL);
      const box = Math.min(W * .84, H * .48);
      const scale = Math.max(1, Math.floor(box / Math.max(im.width, im.height)));
      const sw = im.width * scale, sh = im.height * scale;
      glow(W/2, cy, box * .5, box * .5, alpha(c1, .55));
      g.imageSmoothingEnabled = false;
      g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 18 * dpr; g.shadowOffsetY = 18 * dpr;
      g.drawImage(im, Math.round(W/2 - sw/2), Math.round(cy - sh/2), sw, sh);
      g.shadowColor = 'transparent';
    } catch(e){}
  }

  // 이름표
  const sans = `-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  let y = H - H * .14 - 40 * dpr - (today.types.length ? 34 * dpr : 0);
  g.fillStyle = 'rgba(243,217,153,.9)';
  g.font = `600 ${11 * dpr}px ui-monospace,'SF Mono',monospace`;
  g.fillText(today.day.replace(/-/g,'.') + (today.m.shiny ? '  ·  ✦ SHINY' : ''), W / 2, y - 44 * dpr);
  g.fillStyle = '#ECE9F5'; g.font = `800 ${34 * dpr}px ${sans}`;
  g.fillText(today.name, W / 2, y);
  if (today.sub) {
    g.fillStyle = 'rgba(236,233,245,.7)'; g.font = `400 ${14 * dpr}px ${sans}`;
    g.fillText(today.sub, W / 2, y + 26 * dpr);
  }
  if (today.types.length) {
    g.font = `700 ${12 * dpr}px ${sans}`;
    const pads = today.types.map(t => g.measureText(t).width + 22 * dpr);
    const gap = 6 * dpr, total = pads.reduce((a, b) => a + b, 0) + gap * (pads.length - 1);
    let x = W / 2 - total / 2; const ty = y + 44 * dpr, th = 22 * dpr;
    today.types.forEach((t, i) => {
      g.fillStyle = typeColor(t);
      g.beginPath(); g.roundRect ? g.roundRect(x, ty, pads[i], th, th / 2) : g.rect(x, ty, pads[i], th); g.fill();
      g.fillStyle = '#10132A'; g.textBaseline = 'middle';
      g.fillText(t, x + pads[i] / 2, ty + th / 2 + dpr);
      x += pads[i] + gap;
    });
  }
  return await new Promise(res => cv.toBlob(res, 'image/png'));
}

async function saveImage(){
  if (!today) return;
  const btn = el('saveBtn'); btn.disabled = true;
  try {
    const blob = await renderPNG();
    const file = new File([blob], `pokemon-${today.day}.png`, { type:'image/png' });
    // 휴대폰이면 공유 시트 → '이미지 저장'으로 사진 앱에 바로 넣을 수 있어요
    if (navigator.canShare?.({ files:[file] })) {
      try { await navigator.share({ files:[file], title:`오늘의 포켓몬 · ${today.name}` }); return; }
      catch(e){ if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    toast('이미지를 저장했어요 — 설정에서 배경화면으로 지정하세요');
  } catch(e) {
    toast('이미지를 만들지 못했어요. 인터넷 연결을 확인해주세요.');
  } finally { btn.disabled = false; }
}

/* ═══ 조작 막대 ═════════════════════════════════ */
function paintPrefs(){
  el('poolBtn').setAttribute('aria-pressed', String(prefs.pool === 'box'));
  el('poolBtn').textContent = prefs.pool === 'box' ? '내 박스' : '전체 도감';
  el('clockBtn').setAttribute('aria-pressed', String(prefs.clock));
  document.body.toggleAttribute('data-noclock', !prefs.clock);
}
let idleT;
function wake(){
  document.body.removeAttribute('data-idle');
  clearTimeout(idleT);
  idleT = setTimeout(() => document.body.setAttribute('data-idle',''), 3500);
}
['pointerdown','pointermove','keydown'].forEach(ev => document.addEventListener(ev, wake, { passive:true }));

el('poolBtn').addEventListener('click', () => {
  if (prefs.pool !== 'box' && !box.length) { toast('박스가 비어 있어서 전체 도감에서 골라요'); return; }
  prefs.pool = prefs.pool === 'box' ? 'dex' : 'box';
  savePrefs(); paintPrefs(); show();
  toast(prefs.pool === 'box' ? '내 박스의 포켓몬이 하루씩 돌아가며 나와요' : '전체 도감 1025마리 중에서 매일 골라요');
});
el('clockBtn').addEventListener('click', () => { prefs.clock = !prefs.clock; savePrefs(); paintPrefs(); });
el('saveBtn').addEventListener('click', saveImage);

/* ═══ 시작 ═══════════════════════════════════════ */
(async function init(){
  try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREFKEY) || '{}')); } catch(e){}
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
  await Promise.all([loadBox(), loadIndex()]);
  if (!box.length) prefs.pool = 'dex';
  paintPrefs();
  startClock();
  wake();
  await show();
})();

})();
</script>
